name = "xolchade-bot"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGINS = "https://xolchade.dev"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   BOT_TOKEN         token from @BotFather
#   SETUP_KEY         any long password: opens /setup and binds the inbox group (/bind <key>)
#   TURNSTILE_SECRET  secret key of the Turnstile widget
