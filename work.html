<!doctype html>
<html lang="en">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/bricolage.woff" as="font" type="font/woff" crossorigin>

  <script type="module" src="work.js" blocking="render"></script>

<body>
